name: "Setup Python Environment"
description: "Configura Python com cache de pip e instala o pacote calculadora com extras opcionais."

inputs:
  python-version:
    description: "Versão do Python a instalar (ex.: 3.11, 3.12, 3.13)."
    required: false
    default: "3.12"
  extras:
    description: "Extras do pyproject.toml a instalar (ex.: dev, build, dev,build). Vazio instala apenas o pacote."
    required: false
    default: "dev"
  cache-dependency-path:
    description: "Arquivo monitorado para invalidação do cache de dependências pip."
    required: false
    default: "pyproject.toml"

runs:
  using: "composite"
  steps:
    - name: Configurar Python ${{ inputs.python-version }} com cache de pip
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Instalar pacote e dependências
      shell: bash
      env:
        INSTALL_EXTRAS: ${{ inputs.extras }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "$INSTALL_EXTRAS" ]; then
          python -m pip install -e ".[${INSTALL_EXTRAS}]"
        else
          python -m pip install -e .
        fi
